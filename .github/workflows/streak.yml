name: Keep Streak Alive

on:
  schedule:
    # Runs every 4 hours at :20 past the hour in Kigali (CAT = UTC+2):
    # 03:20, 07:20, 11:20, 15:20 (3:20 PM), 19:20 (7:20 PM), 23:20 (11:20 PM) CAT
    - cron: '20 1,5,9,13,17,21 * * *'
  workflow_dispatch: # Allows manual runs anytime

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git identity
        run: |
          git config --global user.name "Mutararw"
          git config --global user.email "davidkajyojyintwari@gmail.com"

      - name: Make a micro-change
        run: |
          echo "Streak ping: $(date -u)" >> streak.log

      - name: Commit and push changes
        run: |
          git add streak.log
          git commit -m "auto: automated streak upkeep [skip ci]"
          git pull --no-rebase --no-edit origin main
          git push
